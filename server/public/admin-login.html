<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login</title>
<style>
  :root {
    --bg: #17151A;
    --panel: #201D24;
    --border: #322E38;
    --ink: #EDE9F0;
    --ink-soft: #9A93A6;
    --accent: #C9A46A;
    --error: #E08585;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 20px;
  }
  form {
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
  }
  h1 {
    font-size: 1.1rem;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #221A0F;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.92; }
  .error {
    background: rgba(224, 133, 133, 0.12);
    color: var(--error);
    border: 1px solid rgba(224, 133, 133, 0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.82rem;
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>

<form method="POST" action="/admin">
  <h1>Admin login</h1>
  <p class="sub">Enter the dashboard password to see live sessions.</p>
  <div class="error" id="error-box">Wrong password — try again.</div>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autofocus autocomplete="current-password" required />
  <button type="submit">Log in</button>
</form>

<script>
  if (new URLSearchParams(window.location.search).get("error")) {
    document.getElementById("error-box").classList.add("show");
  }
</script>

</body>
</html>
